<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心花りり (Konoka Riri) - iLiFE! Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        riri: {
                            50: '#FFF0F2', 100: '#FFDCE3', 200: '#FFB8C7', 300: '#FF8FAA',
                            400: '#FF6B8A', 500: '#FF4D6D', 600: '#E83E5C', 700: '#C72E4C',
                            800: '#A6243F', 900: '#881E34',
                        }
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'Outfit', 'system-ui', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out', 'slide-up': 'slideUp 0.3s ease-out',
                        'bounce-gentle': 'bounceGentle 0.6s ease-in-out', 'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
                        'typing': 'typing 1.4s ease-in-out infinite', 'wiggle': 'wiggle 1s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        bounceGentle: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-4px)' } },
                        pulseSoft: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.5' } },
                        typing: { '0%, 60%, 100%': { transform: 'translateY(0)' }, '30%': { transform: 'translateY(-6px)' } },
                        wiggle: { '0%, 100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } },
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Noto Sans SC', 'Outfit', system-ui, sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .message-bubble { animation: slideUp 0.3s ease-out; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        .avatar-ring { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #FF4D6D; }
        .avatar-ring-online::after { content: ''; position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; background: #22C55E; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px #FF4D6D; }
        .quick-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .quick-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -4px rgba(255, 77, 109, 0.4); }
        .quick-btn:active { transform: scale(0.97); }
        .typing-dot { animation: typing 1.4s ease-in-out infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        .toast-enter { animation: slideUp 0.3s ease-out; }
        .modal-enter { animation: fadeIn 0.2s ease-out; }
        .modal-content-enter { animation: slideUp 0.3s ease-out; }
        .message-time { font-feature-settings: 'tnum' 1; }
        .thinking-dots span { animation: typing 1.2s ease-in-out infinite; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
        .chat-item { transition: all 0.2s ease; }
        .chat-item:hover { background: #FFF0F2; }
        .chat-item.active { background: #FFDCE3; border-right: 3px solid #FF4D6D; }
        .sidebar-collapsed .sidebar { transform: translateX(-100%); }
        .sidebar-collapsed .main-content { margin-left: 0; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } }
    </style>
</head>
<body class="bg-riri-50 min-h-screen flex">
    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" aria-hidden="true"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar fixed lg:relative inset-y-0 left-0 z-40 w-72 bg-white border-r border-riri-100 flex flex-col transform transition-transform duration-300 ease-in-out lg:translate-x-0">
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-riri-100 flex items-center justify-between">
            <h2 class="font-bold text-riri-700 text-lg flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                聊天记录
            </h2>
            <button id="newChatBtn" class="p-2 rounded-xl bg-riri-500 text-white hover:bg-riri-600 transition-colors" aria-label="新建聊天" title="新建聊天">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            </button>
        </div>

        <!-- Chat List -->
        <div id="chatList" class="flex-1 overflow-y-auto p-2 scrollbar-hide" role="list" aria-label="聊天会话列表"></div>

        <!-- Sidebar Footer -->
        <div class="p-3 border-t border-riri-100">
            <div class="flex items-center gap-2 p-2 bg-riri-50 rounded-xl">
                <div class="w-8 h-8 rounded-full flex items-center justify-center avatar-ring avatar-ring-online flex-shrink-0">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FF4D6D'/%3E%3Cstop offset='100%25' stop-color='%23FF758F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='50' fill='url(%23g)'/%3E%3Ctext x='50' y='62' font-size='40' text-anchor='middle' fill='white' font-weight='bold'%3Eりり%3C/text%3E%3C/svg%3E" alt="りり" class="w-full h-full rounded-full object-cover">
                </div>
                <div class="min-w-0 flex-1">
                    <p class="text-sm font-medium text-gray-900 truncate">心花りり</p>
                    <p class="text-xs text-gray-500 truncate">iLiFE! 赤色担当</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content flex-1 flex flex-col min-w-0 lg:ml-0">
        <!-- API Key Modal -->
        <div id="apiModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur-sm modal-enter" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden modal-content-enter border border-riri-100">
                <div class="bg-gradient-to-r from-riri-500 to-riri-600 px-6 py-5">
                    <h2 id="modalTitle" class="text-white font-bold text-xl flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        设置 DeepSeek API Key
                    </h2>
                </div>
                <div class="p-6 space-y-4">
                    <p class="text-gray-600 text-sm leading-relaxed">输入 DeepSeek API Key 启用云端模式（更智能、记忆更久）。留空则使用本地离线模式。Key 仅保存在本地浏览器。</p>
                    <div>
                        <label for="apiKeyInput" class="block text-sm font-medium text-gray-700 mb-2">API Key (可选)</label>
                        <div class="relative">
                            <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx (留空使用离线模式)" class="w-full px-4 py-3 border-2 border-riri-200 rounded-xl focus:outline-none focus:border-riri-500 focus:ring-2 focus:ring-riri-500/20 transition-all text-sm bg-riri-50" autocomplete="off">
                            <button id="toggleKeyVisibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-riri-500 transition-colors" aria-label="切换显示/隐藏">
                                <svg id="eyeOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                <svg id="eyeClosed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button id="skipApiKey" class="flex-1 px-4 py-3 border-2 border-riri-200 text-riri-600 rounded-xl font-medium hover:bg-riri-50 transition-all">跳过/离线模式</button>
                        <button id="saveApiKey" class="flex-1 px-4 py-3 bg-gradient-to-r from-riri-500 to-riri-600 text-white rounded-xl font-medium hover:from-riri-600 hover:to-riri-700 transition-all shadow-lg shadow-riri-500/25">保存并开始</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Clear History Confirm Modal -->
        <div id="clearModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur-sm modal-enter" role="dialog" aria-modal="true">
            <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden modal-content-enter border border-riri-100">
                <div class="p-6 text-center space-y-4">
                    <div class="w-16 h-16 mx-auto bg-riri-100 rounded-full flex items-center justify-center">
                        <svg class="w-8 h-8 text-riri-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900">清空当前聊天？</h3>
                    <p class="text-gray-500 text-sm">这将删除当前会话的所有消息，无法恢复。</p>
                    <div class="flex gap-3 pt-2">
                        <button id="cancelClear" class="flex-1 px-4 py-2.5 border-2 border-riri-200 text-riri-600 rounded-xl font-medium hover:bg-riri-50 transition-all">取消</button>
                        <button id="confirmClear" class="flex-1 px-4 py-2.5 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-xl font-medium hover:from-red-600 hover:to-red-700 transition-all">确定清空</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Chat Confirm Modal -->
        <div id="deleteChatModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur-sm modal-enter" role="dialog" aria-modal="true">
            <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden modal-content-enter border border-riri-100">
                <div class="p-6 text-center space-y-4">
                    <div class="w-16 h-16 mx-auto bg-red-100 rounded-full flex items-center justify-center">
                        <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900">删除这个聊天？</h3>
                    <p class="text-gray-500 text-sm">会话将永久删除，无法恢复。</p>
                    <div class="flex gap-3 pt-2">
                        <button id="cancelDeleteChat" class="flex-1 px-4 py-2.5 border-2 border-riri-200 text-riri-600 rounded-xl font-medium hover:bg-riri-50 transition-all">取消</button>
                        <button id="confirmDeleteChat" class="flex-1 px-4 py-2.5 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-xl font-medium hover:from-red-600 hover:to-red-700 transition-all">确定删除</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Rename Chat Modal -->
        <div id="renameModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur-sm modal-enter" role="dialog" aria-modal="true">
            <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden modal-content-enter border border-riri-100">
                <div class="p-6 space-y-4">
                    <h3 class="text-lg font-bold text-gray-900 text-center">重命名聊天</h3>
                    <input type="text" id="renameInput" class="w-full px-4 py-3 border-2 border-riri-200 rounded-xl focus:outline-none focus:border-riri-500 focus:ring-2 focus:ring-riri-500/20 text-sm" placeholder="输入新名称" maxlength="30">
                    <div class="flex gap-3 pt-2">
                        <button id="cancelRename" class="flex-1 px-4 py-2.5 border-2 border-riri-200 text-riri-600 rounded-xl font-medium hover:bg-riri-50 transition-all">取消</button>
                        <button id="confirmRename" class="flex-1 px-4 py-2.5 bg-gradient-to-r from-riri-500 to-riri-600 text-white rounded-xl font-medium hover:from-riri-600 hover:to-riri-700 transition-all">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Persona Modal -->
        <div id="personaModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur-sm modal-enter" role="dialog" aria-modal="true">
            <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden modal-content-enter border border-riri-100 max-h-[85vh] flex flex-col">
                <div class="bg-gradient-to-r from-riri-500 to-riri-600 px-6 py-4 flex items-center justify-between">
                    <h2 class="text-white font-bold text-xl flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        调整 りり 性格
                    </h2>
                    <button id="closePersona" class="p-1 rounded-lg hover:bg-white/20 transition-colors" aria-label="关闭">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="p-4 overflow-y-auto space-y-6" id="personaSliders"></div>
                <div class="p-4 border-t border-riri-100 flex gap-3">
                    <button id="resetPersona" class="flex-1 px-4 py-2.5 border-2 border-riri-200 text-riri-600 rounded-xl font-medium hover:bg-riri-50 transition-all">重置默认</button>
                    <button id="savePersona" class="flex-1 px-4 py-2.5 bg-gradient-to-r from-riri-500 to-riri-600 text-white rounded-xl font-medium hover:from-riri-600 hover:to-riri-700 transition-all">保存</button>
                </div>
            </div>
        </div>

        <!-- Header -->
        <header class="bg-white border-b border-riri-100 sticky top-0 z-20 px-4 py-3.5 flex items-center gap-3">
            <button id="menuToggle" class="lg:hidden p-2 rounded-xl text-gray-500 hover:bg-riri-50 hover:text-riri-500 transition-all" aria-label="打开菜单">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="flex-1 flex items-center gap-3 min-w-0">
                <div class="relative w-11 h-11 flex-shrink-0 avatar-ring avatar-ring-online">
                    <img id="ririAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FF4D6D'/%3E%3Cstop offset='100%25' stop-color='%23FF758F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='50' fill='url(%23g)'/%3E%3Ctext x='50' y='62' font-size='40' text-anchor='middle' fill='white' font-weight='bold'%3Eりり%3C/text%3E%3C/svg%3E" alt="心花りり" class="w-full h-full rounded-full object-cover">
                </div>
                <div class="min-w-0 flex-1">
                    <h1 class="font-bold text-gray-900 text-base leading-tight truncate">心花りり <span class="font-normal text-gray-400 text-xs ml-1">@iLiFE!</span></h1>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full pulse-soft"></span>
                        <span id="statusText" class="text-xs text-gray-500 font-medium">在线</span>
                        <span id="modeBadge" class="text-xs text-riri-500 font-medium px-1.5 py-0.5 bg-riri-50 rounded-full">云端模式</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button id="settingsBtn" class="p-2 rounded-xl text-gray-500 hover:bg-riri-50 hover:text-riri-500 transition-all" aria-label="设置" title="设置">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
            </div>
        </header>

        <!-- Chat Messages Area -->
        <div id="chatArea" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide" role="log" aria-live="polite" aria-label="聊天记录"></div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden px-4 pb-2" aria-live="polite">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-riri-100 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-riri-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                </div>
                <div class="bg-riri-100 rounded-2xl rounded-bl-sm px-4 py-2 max-w-xs">
                    <div class="flex gap-1 items-end h-6 thinking-dots">
                        <span class="w-2 h-2 bg-riri-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-riri-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-riri-400 rounded-full"></span>
                    </div>
                </div>
                <span id="typingText" class="text-xs text-gray-400 font-medium">りり 正在想怎么回...</span>
            </div>
        </div>

        <!-- Quick Message Presets -->
        <div id="quickMessages" class="px-4 pb-3 border-t border-riri-100 bg-white" aria-label="快捷消息">
            <div class="flex flex-wrap gap-2" id="quickBtns"></div>
        </div>

        <!-- Input Area -->
        <footer class="bg-white border-t border-riri-100 p-3 pb-safe">
            <form id="chatForm" class="flex items-end gap-2" onsubmit="return false;">
                <div class="flex-1 relative">

                if (hour >= 17 && hour < 20 && Math.random() < 0.15) return this.templates.timeAware.dinnerTime;
                if (hour >= 22 && Math.random() < 0.2) return this.templates.timeAware.lateNight;
                const day = new Date().getDay();
                if ((day === 0 || day === 6) && Math.random() < 0.1) return this.templates.timeAware.weekend;
                if (day === 1 && Math.random() < 0.1) return this.templates.timeAware.monday;
                if (day === 5 && Math.random() < 0.1) return this.templates.timeAware.friday;
                const reactiveIntents = ['tired', 'happy', 'sad', 'hungry', 'sleepy', 'stressed'];
                for (const intent of reactiveIntents) { if (analysis.intents.includes(intent)) return this.pickAndPersonalize(this.templates.reactive[intent]); }
                if (analysis.intents.includes('goodbye')) return this.pickAndPersonalize(this.templates.goodbye);
                if (analysis.intents.includes('compliment')) return this.pickAndPersonalize(["担当好会说话呀～🥺 りり脸红了！(⁄ ⁄•⁄ω⁄•⁄ ⁄)❤️", "呀～ 被担当夸奖了！りり开心得要飞起来了！✨😆", "嘻嘻～ 担当的嘴巴抹了蜜吗？甜死りり了！🍯❤️", "真的吗？担当不是在哄りり开心吧？🥺 但りり选择相信！✨"]);
                if (analysis.intents.includes('name')) { if (this.memory.userNickname) return `担当不是叫 ${this.memory.userNickname} 吗？😆 りり记得超清楚的！`; return "担当想让りり怎么叫呀？🤔 给りり想个专属昵称吧！✨"; }
                if (analysis.intents.includes('age')) return "りり永远18岁哦！✨ (偶像年龄不增长的～😉) 担当几岁啦？";
                for (const intent of analysis.intents) { if (this.templates[intent]) return this.pickAndPersonalize(this.templates[intent]); }
                if (analysis.isQuestion) return this.generateQuestionResponse(analysis.lower);
                return this.pickAndPersonalize(this.templates.idle);
            },
            pickAndPersonalize(responses) {
                let response = responses[Math.floor(Math.random() * responses.length)];
                if (this.memory.userNickname && Math.random() < 0.3) response = `${this.memory.userNickname}、${response.charAt(0).toLowerCase() + response.slice(1)}`;
                if (Math.random() < (this.personality.playfulness / 100) * 0.8) { const e = this.emoticons[Math.floor(Math.random() * this.emoticons.length)]; if (!response.includes(e)) response += ` ${e}`; }
                if (Math.random() < (this.personality.playfulness / 100) * 0.4) { const f = this.fillers[Math.floor(Math.random() * this.fillers.length)]; response += f; }
                if (Math.random() < this.personality.typoRate / 100) { const c = ['~', '～', '...', '✨', '💕', '❤️', '😆', '🥺']; response += c[Math.floor(Math.random() * c.length)]; }
                if (this.personality.energy > 80 && Math.random() < 0.3) { const a = [" 对了对了！", " 顺便一提～", " 啊对了！", " 突然想到～", " 说到这个～", " 顺带一提～", " 突然记起～"]; response += a[Math.floor(Math.random() * a.length)] + this.pickAndPersonalize(this.templates.idle).slice(0, 30); }
                return response;
            },
            generateQuestionResponse(q) {
                if (/什么|啥/.test(q)) return this.pickAndPersonalize(["这个问题好难哦...🤔 りり要思考一下～", "担当想听什么样的答案呀？😆 りり可以编一个！", "什么什么？りり没听清～👂 担当再说一遍？"]);
                if (/怎么|怎样|如何/.test(q)) return this.pickAndPersonalize(["这就要看担当的创意啦！✨ りり觉得... 随心就好～", "りり的建议是：跟着感觉走！💕 过度思考会掉头发的哦！", "怎么怎么样？🤔 りり建议先吃碗米饭冷静一下！🍚"]);
                if (/为什么|为啥/.test(q)) return this.pickAndPersonalize(["因为... 宇宙的意志？✨ 或者单纯因为りり喜欢呀！😆", "为什么呢～ 可能因为担当太可爱了所以宇宙安排了这件事？💕", "这个问题问倒りり了！😵 担当知道的话教教りり！"]);
                if (/谁/.test(q)) return this.pickAndPersonalize(["当然是... 担当呀！😝 (自信满满)", "谁谁谁？🤔 りり猜是担当！不对吗？", "秘密～✨ 猜对了りり请担当喝奶茶！🧋"]);
                if (/哪里|哪儿|在哪/.test(q)) return this.pickAndPersonalize(["在担当心里呀～💕 (脸红) 哎呀说漏嘴了！", "りり在练习室/家里/咖啡厅/梦里... 随机切换中！😆", "这里呀！就在手机屏幕这边～📱 担当在哪里？"]);
                if (/几时|什么时间|几点/.test(q)) return this.pickAndPersonalize([`现在是 ${new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'})} 呀～⏰ 担当该干嘛了？`, "时间是个概念，但饭点是真的！🍚 担当饿了吗？", "りり的生物钟说：该吃米饭时间！⏰🍚"]);
                return this.pickAndPersonalize(["好问题！🤔 りり要认真思考一下... 想好了再告诉担当！", "这个... りり觉得担当自己心里可能有答案哦？✨", "嗯～ 这个问题交给担当的直觉吧！💕 りり相信担当！"]);
            },
            getTypingDelay(response) { const base = 800, char = Math.min(response.length * 30, 2000), pf = (100 - this.personality.energy) / 100 * 500, v = (Math.random() - 0.5) * 400; return Math.max(600, base + char - pf + v); },
            getGreeting() { const h = new Date().getHours(); let k = 'afternoon'; if (h >= 5 && h < 11) k = 'morning'; else if (h >= 11 && h < 18) k = 'afternoon'; else if (h >= 18 && h < 23) k = 'evening'; else k = 'night'; return this.pickAndPersonalize(this.templates.greeting[k]); },
            resetPersonality() { this.personality = { energy: 85, sweetness: 90, playfulness: 80, caring: 88, idol: 75, girlfriend: 70, riceObsession: 95, ghibliLove: 70, cafeLove: 65, typoRate: 15 }; this.save(); },
            updatePersonality(key, value) { this.personality[key] = value; this.save(); },
        };

        // ==================== CHAT SESSION MANAGEMENT ====================
        const ChatManager = {
            chats: [],
            currentChatId: null,
            init() {
                const saved = localStorage.getItem('riri_chats');
                if (saved) {
                    try { this.chats = JSON.parse(saved); } catch (e) { this.chats = []; }
                }
                if (this.chats.length === 0) this.createNewChat();
                else {
                    const lastActive = this.chats.reduce((a, b) => a.updatedAt > b.updatedAt ? a : b);
                    this.currentChatId = lastActive.id;
                }
                this.renderChatList();
                this.loadCurrentChat();
            },
            createNewChat() {
                const id = 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                const now = Date.now();
                const chat = {
                    id, title: '新对话', messages: [], createdAt: now, updatedAt: now,
                    mode: 'cloud', // 'cloud' or 'local'
                };
                this.chats.unshift(chat);
                this.currentChatId = id;
                this.save();
                this.renderChatList();
                return chat;
            },
            getCurrentChat() { return this.chats.find(c => c.id === this.currentChatId) || this.chats[0]; },
            switchChat(id) {
                const chat = this.chats.find(c => c.id === id);
                if (chat) { this.currentChatId = id; this.loadCurrentChat(); this.renderChatList(); closeSidebar(); }
            },
            deleteChat(id) {
                const idx = this.chats.findIndex(c => c.id === id);
                if (idx === -1) return;
                this.chats.splice(idx, 1);
                if (this.currentChatId === id) {
                    this.currentChatId = this.chats[0]?.id || null;
                    if (!this.currentChatId) this.createNewChat();
                    else this.loadCurrentChat();
                }
                this.save(); this.renderChatList();
            },
            renameChat(id, title) {
                const chat = this.chats.find(c => c.id === id);
                if (chat) { chat.title = title.trim() || '新对话'; chat.updatedAt = Date.now(); this.save(); this.renderChatList(); }
            },
            updateChatMode(id, mode) {
                const chat = this.chats.find(c => c.id === id);
                if (chat) { chat.mode = mode; chat.updatedAt = Date.now(); this.save(); this.renderChatList(); }
            },
            addMessage(role, content) {
                const chat = this.getCurrentChat();
                if (!chat) return;
                chat.messages.push({ role, content, timestamp: Date.now() });
                chat.updatedAt = Date.now();
                if (chat.messages.length <= 2) chat.title = content.slice(0, 20) + (content.length > 20 ? '...' : '');
                this.save();
            },
            getMessages() { const chat = this.getCurrentChat(); return chat?.messages || []; },
            clearCurrentChat() {
                const chat = this.getCurrentChat();
                if (chat) { chat.messages = []; chat.updatedAt = Date.now(); this.save(); this.loadCurrentChat(); }
            },
            exportCurrentChat() {
                const chat = this.getCurrentChat();
                if (!chat || chat.messages.length === 0) return null;
                return chat.messages.map(m => `[${formatTime(new Date(m.timestamp))}] ${m.role === 'user' ? '担当' : 'りり'}: ${m.content}`).join('\n\n');
            },
            save() { localStorage.setItem('riri_chats', JSON.stringify(this.chats)); },
            loadCurrentChat() {
                const chat = this.getCurrentChat();
                if (chat) {
                    messages.length = 0;
                    messages.push(...chat.messages);
                    renderHistory();
                    updateModeBadge(chat.mode);
                }
            },
            renderChatList() {

                    const isActive = chat.id === this.currentChatId;

                    return `
                        <div class="chat-item ${isActive ? 'active' : ''} rounded-xl p-3 flex flex-col gap-2 group" data-chat-id="${chat.id}" role="listitem">

                                    <span class="text-xs text-gray-400 flex-shrink-0">${modeIcon}</span>

                                </div>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button class="rename-chat-btn p-1.5 rounded-lg hover:bg-riri-100 text-gray-400 hover:text-riri-600 transition-colors" data-chat-id="${chat.id}" aria-label="重命名" title="重命名">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    </button>
                                    <button class="delete-chat-btn p-1.5 rounded-lg hover:bg-red-100 text-gray-400 hover:text-red-600 transition-colors" data-chat-id="${chat.id}" aria-label="删除" title="删除">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="flex items-center justify-between text-xs text-gray-400">
                                <span>${timeStr}</span>
                                <span class="px-1.5 py-0.5 rounded-full ${chat.mode === 'cloud' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}">${chat.mode === 'cloud' ? '云端' : '本地'}</span>
                            </div>
                        </div>
                    `;
                }).join('') + `
                    <button id="newChatBtnBottom" class="w-full px-3 py-2.5 text-center text-riri-500 hover:bg-riri-50 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition-colors" style="margin-top: 8px;">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        新建聊天
                    </button>
                `;

                // Bind events
                container.querySelectorAll('.chat-item[data-chat-id]').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (!e.target.closest('.rename-chat-btn') && !e.target.closest('.delete-chat-btn')) {
                            ChatManager.switchChat(item.dataset.chatId);

        // ==================== UTILITY FUNCTIONS ====================
        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.createElement('div');
            const icons = { info: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>', success: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>', error: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>', warning: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>' };
            const colors = { info: 'bg-blue-50 text-blue-700 border-blue-200', success: 'bg-green-50 text-green-700 border-green-200', error: 'bg-red-50 text-red-700 border-red-200', warning: 'bg-yellow-50 text-yellow-700 border-yellow-200' };
            toast.className = `toast-enter flex items-center gap-2 px-4 py-3 rounded-xl border shadow-lg min-w-[200px] max-w-xs ${colors[type]}`;
            toast.innerHTML = `${icons[type]}<span class="text-sm font-medium">${message}</span>`;
            els.toastContainer.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeIn 0.2s ease-out reverse'; setTimeout(() => toast.remove(), 200); }, duration);
        }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function formatTime(date) { return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }); }
        function formatChatTime(ts) { const d = new Date(ts), now = new Date(); if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }); return d.toLocaleDateString('zh-CN', { year: '2-digit', month: '2-digit', day: '2-digit' }); }
        function autoResizeTextarea(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 128) + 'px'; }
        function scrollToBottom(smooth = true) { els.chatArea.scrollTo({ top: els.chatArea.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); }
        function closeSidebar() { els.sidebar.classList.remove('open'); els.sidebarOverlay.classList.add('hidden'); }
        function openSidebar() { els.sidebar.classList.add('open'); els.sidebarOverlay.classList.remove('hidden'); }

            const avatarHtml = isUser ? `<div class="w-8 h-8 rounded-full bg-gradient-to-br from-gray-300 to-gray-400 flex items-center justify-center flex-shrink-0"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>` : `<div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 avatar-ring avatar-ring-online"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FF4D6D'/%3E%3Cstop offset='100%25' stop-color='%23FF758F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='50' fill='url(%23g)'/%3E%3Ctext x='50' y='62' font-size='40' text-anchor='middle' fill='white' font-weight='bold'%3Eりり%3C/text%3E%3C/svg%3E" alt="りり" class="w-full h-full rounded-full object-cover"></div>`;
            const bubbleClass = isUser ? 'bg-riri-500 text-white rounded-2xl rounded-tr-sm shadow-lg shadow-riri-500/25' : 'bg-white text-gray-800 rounded-2xl rounded-tl-sm border border-riri-100 shadow-sm';
            wrapper.innerHTML = `${avatarHtml}<div class="flex-1 min-w-0 max-w-[75%]"><div class="${bubbleClass} px-4 py-2.5"><p class="text-sm leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(content)}</p></div><div class="flex items-center gap-1.5 mt-1.5 ${isUser ? 'justify-end' : ''}"><time class="message-time text-[10px] text-gray-400 font-medium tabular-nums">${formatTime(time)}</time>${isUser ? '<svg class="w-3.5 h-3.5 text-riri-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>' : ''}</div></div>`;
            els.chatArea.appendChild(wrapper);
            return wrapper;
        }
        function renderQuickMessages() { const msgs = RiriBrain.loadQuickMessages(); els.quickBtns.innerHTML = msgs.map((m, i) => `<button type="button" class="quick-btn px-3 py-1.5 bg-white border border-riri-200 text-riri-600 text-sm rounded-full hover:border-riri-400 hover:text-riri-500 focus:outline-none focus:ring-2 focus:ring-riri-500/20 transition-all" data-quick="${escapeHtml(m)}" style="animation-delay: ${i * 50}ms">${escapeHtml(m)}</button>`).join(''); }
        function renderHistory() { els.chatArea.innerHTML = ''; if (messages.length === 0) { const w = document.createElement('div'); w.className = 'flex gap-2 message-bubble'; w.innerHTML = `<div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 avatar-ring avatar-ring-online"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FF4D6D'/%3E%3Cstop offset='100%25' stop-color='%23FF758F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='50' fill='url(%23g)'/%3E%3Ctext x='50' y='62' font-size='40' text-anchor='middle' fill='white' font-weight='bold'%3Eりり%3C/text%3E%3C/svg%3E" alt="りり" class="w-full h-full rounded-full object-cover"></div><div class="flex-1 max-w-[75%]"><div class="bg-white text-gray-800 rounded-2xl rounded-tl-sm border border-riri-100 shadow-sm px-4 py-3"><p class="text-sm leading-relaxed">${escapeHtml(RiriBrain.getGreeting())}</p></div><div class="flex items-center gap-1.5 mt-1.5"><time class="message-time text-[10px] text-gray-400 font-medium tabular-nums">${formatTime(new Date())}</time></div></div>`; els.chatArea.appendChild(w); } else { messages.forEach((m, i) => renderMessage(m.role, m.content, new Date(m.timestamp), i > messages.length - 3)); } scrollToBottom(false); }

        // ==================== API KEY ====================
        function checkApiKey() { if (!apiKey) { els.apiModal.classList.remove('hidden'); els.apiModal.classList.add('flex'); els.apiKeyInput.focus(); return false; } return true; }
        function validateApiKey(key) { return key.trim().startsWith('sk-') && key.trim().length > 20; }
        function setApiKey(key) { apiKey = key.trim(); localStorage.setItem('riri_api_key', apiKey); els.apiModal.classList.add('hidden'); els.apiModal.classList.remove('flex'); showToast(apiKey ? 'API Key 保存成功！云端模式已启用✨' : '已切换到离线模式', 'success'); ChatManager.updateChatMode(ChatManager.currentChatId, apiKey ? 'cloud' : 'local'); updateModeBadge(apiKey ? 'cloud' : 'local'); }

        // ==================== DEEPSEEK API ====================
        async function sendToDeepSeek(userMessage) {
            if (!apiKey) return null;
            abortController = new AbortController();
            const chat = ChatManager.getCurrentChat();
            const apiMessages = [{ role: 'system', content: CONFIG.SYSTEM_PROMPT }, ...chat.messages.slice(-CONFIG.MAX_HISTORY * 2).map(m => ({ role: m.role, content: m.content })), { role: 'user', content: userMessage }];
            try {
                const res = await fetch(CONFIG.API_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` }, body: JSON.stringify({ model: CONFIG.MODEL, messages: apiMessages, temperature: 0.85, max_tokens: 500, stream: false }), signal: abortController.signal });
                if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error?.message || `API 错误: ${res.status}`); }
                const data = await res.json(); return data.choices?.[0]?.message?.content?.trim() || null;
            } catch (e) { if (e.name === 'AbortError') return null; console.error('DeepSeek API Error:', e); throw e; }
        }

        // ==================== CHAT LOGIC ====================
        async function handleSend() {
            const content = els.messageInput.value.trim();
            if (!content || isLoading) return;
            if (!apiKey && !checkApiKey()) return;

            const userMsg = { role: 'user', content, timestamp: Date.now() };
            messages.push(userMsg); ChatManager.addMessage('user', content);
            renderMessage('user', content, new Date(userMsg.timestamp));
            els.messageInput.value = ''; els.messageInput.style.height = 'auto';
            els.sendBtn.disabled = true; els.sendBtn.classList.add('bg-riri-200', 'text-riri-500'); els.sendBtn.classList.remove('bg-riri-500', 'text-white');
            scrollToBottom();

            isLoading = true;
            const typingTexts = ['りり 正在想怎么回...', 'りり 正在认真思考中...', 'りり 正在组织语言...', 'りり 正在偷偷吃米饭... 🍚', 'りり 正在翻吉卜力台词... 🎬'];
            els.typingText.textContent = typingTexts[Math.floor(Math.random() * typingTexts.length)];
            els.typingIndicator.classList.remove('hidden');
            scrollToBottom();

            try {
                let reply = null;
                const chat = ChatManager.getCurrentChat();
                if (apiKey && chat?.mode === 'cloud') { reply = await sendToDeepSeek(content); }
                if (!reply) { reply = RiriBrain.generateResponse(content); await new Promise(r => setTimeout(r, RiriBrain.getTypingDelay(reply))); }

                if (reply) {
                    const assistantMsg = { role: 'assistant', content: reply, timestamp: Date.now() };
                    messages.push(assistantMsg); ChatManager.addMessage('assistant', reply);
                    renderMessage('assistant', reply, new Date(assistantMsg.timestamp));
                } else throw new Error('空回复');
            } catch (e) {
                showToast(e.message.includes('401') || e.message.includes('403') ? 'API Key 无效或已过期，已切换到本地模式' : e.message.includes('network') || e.message.includes('fetch') ? '网络连接失败，已切换到本地模式' : '发送失败，请重试', 'error');
                messages.pop(); ChatManager.getCurrentChat().messages.pop();
                if (apiKey) { apiKey = ''; localStorage.removeItem('riri_api_key'); ChatManager.updateChatMode(ChatManager.currentChatId, 'local'); updateModeBadge('local'); }
                renderHistory();
            } finally {
                isLoading = false; els.typingIndicator.classList.add('hidden'); els.sendBtn.disabled = false; els.sendBtn.classList.remove('bg-riri-200', 'text-riri-500'); els.sendBtn.classList.add('bg-riri-500', 'text-white'); els.messageInput.focus(); scrollToBottom();
                if (Math.random() < 0.3) renderQuickMessages();
            }
        }

        // ==================== MODALS ====================
        function openRenameModal(id) { chatToRename = id; const chat = ChatManager.chats.find(c => c.id === id); if (chat) { els.renameInput.value = chat.title; els.renameModal.classList.remove('hidden'); els.renameModal.classList.add('flex'); els.renameInput.focus(); els.renameInput.select(); } }
        function closeRenameModal() { els.renameModal.classList.add('hidden'); els.renameModal.classList.remove('flex'); chatToRename = null; }
        function openDeleteChatModal(id) { chatToDelete = id; els.deleteChatModal.classList.remove('hidden'); els.deleteChatModal.classList.add('flex'); }
        function closeDeleteChatModal() { els.deleteChatModal.classList.add('hidden'); els.deleteChatModal.classList.remove('flex'); chatToDelete = null; }

        // ==================== EVENT LISTENERS ====================
        els.chatForm.addEventListener('submit', e => { e.preventDefault(); handleSend(); });
        els.messageInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
        els.messageInput.addEventListener('input', () => { autoResizeTextarea(els.messageInput); const has = els.messageInput.value.trim().length > 0; els.sendBtn.disabled = !has || isLoading; if (has && !isLoading) { els.sendBtn.classList.remove('bg-riri-200', 'text-riri-500'); els.sendBtn.classList.add('bg-riri-500', 'text-white'); } else { els.sendBtn.classList.add('bg-riri-200', 'text-riri-500'); els.sendBtn.classList.remove('bg-riri-500', 'text-white'); } });

        // API Key Modal
        els.toggleKeyVisibility.addEventListener('click', () => { const pw = els.apiKeyInput.type === 'password'; els.apiKeyInput.type = pw ? 'text' : 'password'; els.eyeOpen.classList.toggle('hidden', pw); els.eyeClosed.classList.toggle('hidden', !pw); });
        els.apiKeyInput.addEventListener('input', () => { const v = validateApiKey(els.apiKeyInput.value); els.saveApiKey.disabled = !v && els.apiKeyInput.value.length > 0; });
        els.saveApiKey.addEventListener('click', () => { const v = els.apiKeyInput.value.trim(); if (!v || validateApiKey(v)) setApiKey(v); });
        els.skipApiKey.addEventListener('click', () => { setApiKey(''); });
        els.apiModal.addEventListener('click', e => { if (e.target === els.apiModal) { if (!apiKey) return; els.apiModal.classList.add('hidden'); els.apiModal.classList.remove('flex'); } });

        // Clear Current Chat
        els.clearCurrentChatBtn.addEventListener('click', () => { els.settingsDropdown.classList.add('hidden'); els.clearModal.classList.remove('hidden'); els.clearModal.classList.add('flex'); });
        els.confirmClear.addEventListener('click', () => { ChatManager.clearCurrentChat(); els.clearModal.classList.add('hidden'); els.clearModal.classList.remove('flex'); showToast('当前聊天已清空～🥺', 'info'); });
        els.cancelClear.addEventListener('click', () => { els.clearModal.classList.add('hidden'); els.clearModal.classList.remove('flex'); });
        els.clearModal.addEventListener('click', e => { if (e.target === els.clearModal) { els.clearModal.classList.add('hidden'); els.clearModal.classList.remove('flex'); } });

        // Delete Chat
        els.confirmDeleteChat.addEventListener('click', () => { if (chatToDelete) { ChatManager.deleteChat(chatToDelete); showToast('聊天已删除', 'success'); } closeDeleteChatModal(); });
        els.cancelDeleteChat.addEventListener('click', closeDeleteChatModal);
        els.deleteChatModal.addEventListener('click', e => { if (e.target === els.deleteChatModal) closeDeleteChatModal(); });

        // Rename Chat
        els.confirmRename.addEventListener('click', () => { if (chatToRename) { ChatManager.renameChat(chatToRename, els.renameInput.value); showToast('重命名成功✨', 'success'); } closeRenameModal(); });
        els.cancelRename.addEventListener('click', closeRenameModal);
        els.renameModal.addEventListener('click', e => { if (e.target === els.renameModal) closeRenameModal(); });
        els.renameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); els.confirmRename.click(); } });

        // Sidebar
        els.menuToggle.addEventListener('click', openSidebar);
        els.sidebarOverlay.addEventListener('click', closeSidebar);
        els.newChatBtn.addEventListener('click', () => { ChatManager.createNewChat(); ChatManager.loadCurrentChat(); closeSidebar(); });

        // Settings Dropdown
        els.settingsBtn.addEventListener('click', () => { els.settingsDropdown.classList.toggle('hidden'); });
        document.addEventListener('click', e => { if (!els.settingsBtn.contains(e.target) && !els.settingsDropdown.contains(e.target)) els.settingsDropdown.classList.add('hidden'); });

        // Settings Actions
        els.personaBtn.addEventListener('click', () => { els.settingsDropdown.classList.add('hidden'); openPersonaModal(); });
        els.changeApiKeyBtn.addEventListener('click', () => { els.settingsDropdown.classList.add('hidden'); els.apiKeyInput.value = apiKey; els.apiModal.classList.remove('hidden'); els.apiModal.classList.add('flex'); els.apiKeyInput.focus(); });
        els.exportBtn.addEventListener('click', () => { els.settingsDropdown.classList.add('hidden'); const text = ChatManager.exportCurrentChat(); if (!text) return showToast('暂无聊天记录可导出～', 'warning'); const blob = new Blob([text], { type: 'text/plain;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = `riri_chat_${new Date().toISOString().slice(0,10)}.txt`; a.click(); URL.revokeObjectURL(url); showToast('导出成功！✨', 'success'); });
        els.aboutBtn.addEventListener('click', () => { els.settingsDropdown.classList.add('hidden'); showToast('iLiFE! 心花りり Chat v3.0\n双模式：DeepSeek云端 + 本地离线大脑\n多会话管理 · 人格可调 · 数据本地存储\n❤️ 赤色担当 永远爱你！', 'info', 5000); });

        // Quick Messages
        els.quickBtns.addEventListener('click', e => { const btn = e.target.closest('[data-quick]'); if (btn) { els.messageInput.value = btn.dataset.quick; autoResizeTextarea(els.messageInput); els.messageInput.focus(); handleSend(); } });

        // Persona Modal
        function openPersonaModal() {
            const sliders = [{ key: 'energy', label: '元气度 ⚡', emoji: '⚡', desc: '回复的活力和热情程度' }, { key: 'sweetness', label: '甜度 🍯', emoji: '🍯', desc: '语气的温柔和撒娇程度' }, { key: 'playfulness', label: '顽皮度 😝', emoji: '😝', desc: '开玩笑、颜文字、恶作剧倾向' }, { key: 'caring', label: '关怀度 🤗', emoji: '🤗', desc: '主动关心、安慰、支持的程度' }, { key: 'idol', label: '偶像感 🎤', emoji: '🎤', desc: '职业偶像的专业感和距离感' }, { key: 'girlfriend', label: '女友感 💕', emoji: '💕', desc: '亲密、专属、占有欲的表达' }, { key: 'riceObsession', label: '米饭执念 🍚', emoji: '🍚', desc: '提到米饭的频率和执着程度' }, { key: 'ghibliLove', label: '吉卜力爱 🎬', emoji: '🎬', desc: '聊吉卜力电影的热情程度' }, { key: 'cafeLove', label: '咖啡厅控 ☕', emoji: '☕', desc: '推荐咖啡厅、甜点的频率' }, { key: 'typoRate', label: '口语化程度 💬', emoji: '💬', desc: '语气词、语尾、随性表达的比例' }];
            els.personaSliders.innerHTML = sliders.map(s => `<div class="space-y-2"><div class="flex items-center justify-between"><label class="font-medium text-gray-700 flex items-center gap-2"><span class="text-xl">${s.emoji}</span>${s.label}</label><span id="val_${s.key}" class="text-riri-500 font-bold text-lg">${RiriBrain.personality[s.key]}</span></div><p class="text-xs text-gray-400">${s.desc}</p><input type="range" min="0" max="100" value="${RiriBrain.personality[s.key]}" class="w-full h-2 bg-riri-100 rounded-lg appearance-none accent-riri-500 cursor-pointer" id="slider_${s.key}" data-key="${s.key}"></div>`).join('');
            sliders.forEach(s => { const sl = document.getElementById(`slider_${s.key}`), vl = document.getElementById(`val_${s.key}`); sl.addEventListener('input', () => vl.textContent = sl.value); });
            els.personaModal.classList.remove('hidden'); els.personaModal.classList.add('flex');
        }
        function closePersonaModal() { els.personaModal.classList.add('hidden'); els.personaModal.classList.remove('flex'); }
        els.closePersona.addEventListener('click', closePersonaModal);
        els.personaModal.addEventListener('click', e => { if (e.target === els.personaModal) closePersonaModal(); });
        els.resetPersona.addEventListener('click', () => { RiriBrain.resetPersonality(); openPersonaModal(); showToast('性格已重置为默认值～✨', 'success'); });
        els.savePersona.addEventListener('click', () => { ['energy','sweetness','playfulness','caring','idol','girlfriend','riceObsession','ghibliLove','cafeLove','typoRate'].forEach(k => RiriBrain.updatePersonality(k, parseInt(document.getElementById(`slider_${k}`).value))); closePersonaModal(); showToast('りり 的性格已更新！快来聊聊看～✨', 'success'); renderQuickMessages(); });

        // ==================== INIT ====================
        function init() {
            RiriBrain.init();
            ChatManager.init();
            renderQuickMessages();
            updateStatus();
            setInterval(updateStatus, 30000);
            setInterval(renderQuickMessages, 3600000);
            setInterval(() => RiriBrain.save(), 60000);
            els.messageInput.focus();

            // Check API key on load if no chats exist
            if (!apiKey && ChatManager.chats.length === 1 && ChatManager.chats[0].messages.length === 0) {
                setTimeout(() => checkApiKey(), 300);
            }
        }
        init();
    </script>
</body>
</html>
